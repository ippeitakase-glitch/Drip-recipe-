<style>
:root{
  --stone:#E6E4DD;
  --card:#F2F1EC;
  --ink:#161A17;
  --slate:#6C716A;
  --rule:#CBC8BE;
  --water:#1F3FBF;
  --water-soft:rgba(31,63,191,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  color-scheme:light dark;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --stone:#14161A;
    --card:#1C1F24;
    --ink:#E9E8E2;
    --slate:#9198A0;
    --rule:#2E333A;
    --water:#7C9BFF;
    --water-soft:rgba(124,155,255,.14);
  }
}
:root[data-theme="dark"]{
  --stone:#14161A; --card:#1C1F24; --ink:#E9E8E2;
  --slate:#9198A0; --rule:#2E333A;
  --water:#7C9BFF; --water-soft:rgba(124,155,255,.14);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--stone);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px;line-height:1.6;
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 0}

header{margin-bottom:22px}
h1{font-size:20px;font-weight:700;letter-spacing:.06em;margin:0 0 2px}
header p{margin:0;color:var(--slate);font-size:13px}

.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px 14px;padding:0 18px 2px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--rule);background:transparent;color:var(--slate);
  font:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.tab:focus-visible{outline:2px solid var(--water);outline-offset:2px}

.sub{display:flex;gap:18px;border-bottom:1px solid var(--rule);margin-bottom:18px}
.sub button{
  border:0;background:none;font:inherit;font-size:14px;font-weight:500;color:var(--slate);
  padding:0 0 9px;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;
}
.sub button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--water)}

.gear{font-size:13px;color:var(--slate);margin:0 0 16px;line-height:1.75}
.gear b{color:var(--ink);font-weight:500}

.spec{display:flex;gap:0;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:22px;background:var(--card)}
.spec div{flex:1;padding:11px 12px;border-right:1px solid var(--rule)}
.spec div:last-child{border-right:0}
.spec span{display:block;font-size:11px;color:var(--slate)}
.spec strong{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}

ol.steps{list-style:none;margin:0 0 24px;padding:0}
ol.steps li{
  position:relative;overflow:hidden;
  display:flex;align-items:baseline;gap:12px;
  padding:13px 14px;border:1px solid var(--rule);border-radius:10px;
  background:var(--card);margin-bottom:8px;
}
ol.steps li .fill{
  position:absolute;inset:0 auto 0 0;width:0;background:var(--water-soft);
  transition:width .25s linear;pointer-events:none;
}
ol.steps li > *{position:relative}
li.on{border-color:var(--water)}
li.done{opacity:.45}
.at{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;min-width:52px}
.body{flex:1;min-width:0}
.body .n{font-weight:500;font-size:15px}
.body .s{font-size:12px;color:var(--slate);line-height:1.5}
.ml{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;white-space:nowrap}
.ml em{font-style:normal;font-size:11px;font-weight:400;color:var(--slate);margin-left:1px}

h2{font-size:13px;font-weight:700;margin:0 0 8px;letter-spacing:.04em}
.notes{font-size:13.5px;color:var(--slate);line-height:1.85;margin:0 0 10px;padding-left:1.1em}
.notes li{margin-bottom:3px}
.src{font-size:12px;color:var(--slate);margin:0 0 40px}
.src a{color:var(--water)}

.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  background:var(--card);border-top:1px solid var(--rule);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));
}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:14px}
.clock{font-variant-numeric:tabular-nums;font-size:40px;font-weight:700;line-height:1;letter-spacing:-.01em}
.next{flex:1;min-width:0;font-size:12px;color:var(--slate);line-height:1.4}
.next b{display:block;color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{
  border:0;font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:11px 20px;cursor:pointer;
  background:var(--water);color:#fff;
}
.bar button.ghost{background:transparent;color:var(--slate);border:1px solid var(--rule);padding:11px 14px;font-weight:500}
.bar button:focus-visible{outline:2px solid var(--water);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Brew Book</h1>
    <p>4店舗のレシピと注湯タイマー</p>
  </header>

  <div class="tabs" id="shops" role="tablist" aria-label="店舗"></div>
  <div class="sub" id="recipes" role="tablist" aria-label="レシピ"></div>

  <p class="gear" id="gear"></p>
  <div class="spec" id="spec"></div>
  <ol class="steps" id="steps"></ol>

  <h2>メモ</h2>
  <ul class="notes" id="notes"></ul>
  <p class="src" id="src"></p>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="clock" id="clock">0:00</div>
    <div class="next"><b id="nextName">スタートで計測開始</b><span id="nextSub"></span></div>
    <button id="reset" class="ghost">リセット</button>
    <button id="toggle">スタート</button>
  </div>
</div>

<script>
const DATA = [

let si=0, ri=0, t0=null, elapsed=0, running=false, raf=null, lastStep=-1;

const $=id=>document.getElementById(id);
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");

try{
  const saved=JSON.parse(localStorage.getItem("brewbook")||"null");
  if(saved && DATA[saved.s] && DATA[saved.s].recipes[saved.r]){si=saved.s;ri=saved.r;}
}catch(e){}

function save(){try{localStorage.setItem("brewbook",JSON.stringify({s:si,r:ri}))}catch(e){}}

function renderShops(){
  $("shops").innerHTML="";
  DATA.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="tab";b.textContent=d.short;b.setAttribute("role","tab");
    b.setAttribute("aria-selected",i===si);
    b.onclick=()=>{si=i;ri=0;stop();render();save();};
    $("shops").appendChild(b);
  });
}

function render(){
  const shop=DATA[si], rec=shop.recipes[ri];
  renderShops();

  $("recipes").innerHTML="";
  shop.recipes.forEach((r,i)=>{
    const b=document.createElement("button");
    b.textContent=r.name;b.setAttribute("role","tab");b.setAttribute("aria-selected",i===ri);
    b.onclick=()=>{ri=i;stop();render();save();};
    $("recipes").appendChild(b);
  });

  $("gear").innerHTML="<b>"+shop.shop+"</b><br>"+shop.gear;

  $("spec").innerHTML=
    '<div><span>豆</span><strong>'+rec.dose+'</strong></div>'+
    '<div><span>湯量</span><strong>'+rec.water+'</strong></div>'+
    '<div><span>湯温</span><strong>'+rec.temp+'</strong></div>';

  $("steps").innerHTML="";
  rec.steps.forEach(st=>{
    const li=document.createElement("li");
    li.innerHTML='<span class="fill"></span>'+
      '<span class="at">'+fmt(st.t)+'</span>'+
      '<span class="body"><span class="n">'+st.n+'</span>'+
      (st.s?'<div class="s">'+st.s+'</div>':'')+'</span>'+
      '<span class="ml">'+st.ml+'<em>ml</em></span>';
    $("steps").appendChild(li);
  });

  $("notes").innerHTML=rec.notes.map(n=>"<li>"+n+"</li>").join("");
  $("src").innerHTML=shop.src.u
    ? '出典：<a href="'+shop.src.u+'" target="_blank" rel="noopener">'+shop.src.t+'</a>'
    : '出典：'+shop.src.t;

  lastStep=-1;
  paint();
}

function paint(){
  const steps=DATA[si].recipes[ri].steps;
  const els=$("steps").children;
  let cur=-1;
  for(let i=0;i<steps.length;i++) if(elapsed>=steps[i].t) cur=i;

  for(let i=0;i<els.length;i++){
    const li=els[i], fill=li.querySelector(".fill");
    li.className="";
    if(i<cur) li.className="done";
    if(i===cur && running) li.className="on";
    let w=0;
    if(i<cur) w=100;
    else if(i===cur){
      const end=steps[i+1]?steps[i+1].t:steps[i].t+30;
      w=Math.min(100,(elapsed-steps[i].t)/(end-steps[i].t)*100);
    }
    fill.style.width=w+"%";
  }

  if(running && cur!==lastStep && cur>=0){
    lastStep=cur;
    if(navigator.vibrate) navigator.vibrate(60);
  }

  const nxt=steps.find(s=>s.t>elapsed);
  if(!running && elapsed===0){
    $("nextName").textContent="スタートで計測開始";$("nextSub").textContent="";
  }else if(nxt){
    $("nextName").textContent="次：" + nxt.n + "（" + nxt.ml + "ml まで）";
    $("nextSub").textContent="あと "+Math.ceil(nxt.t-elapsed)+"秒";
  }else{
    $("nextName").textContent="全工程おわり";$("nextSub").textContent="";
  }
  $("clock").textContent=fmt(elapsed);
}

function tick(){
  elapsed=(performance.now()-t0)/1000;
  paint();
  raf=requestAnimationFrame(tick);
}
let wl=null;
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator && !wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null});}
    if(!on && wl){await wl.release();wl=null;}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&running)keepAwake(true)});
function start(){
  keepAwake(true);
  running=true;t0=performance.now()-elapsed*1000;
  $("toggle").textContent="一時停止";
  raf=requestAnimationFrame(tick);
}
function pause(){
  keepAwake(false);
  running=false;cancelAnimationFrame(raf);
  $("toggle").textContent="再開";paint();
}
function stop(){
  keepAwake(false);
  running=false;cancelAnimationFrame(raf);elapsed=0;lastStep=-1;
  $("toggle").textContent="スタート";paint();
}
$("toggle").onclick=()=>running?pause():start();
$("reset").onclick=stop;

render();
</script>
